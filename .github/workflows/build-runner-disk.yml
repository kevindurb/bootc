---
# Build the ci-runner qcow2 disk image (via bootc-image-builder) from the
# ci-runner bootc image that reusable-build.yml publishes, wrap it in a
# scratch image at ghcr.io/kevindurb/ci-runner-disk (a "containerDisk" image
# for KubeVirt), and cosign-sign it together with the ci-runner image.
#
# Runs automatically after the Build workflow completes on main, and manually
# via workflow_dispatch.
name: Build runner disk
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-runner-disk:
    name: Build ci-runner qcow2 and publish containerDisk
    # workflow_dispatch always runs; workflow_run only on successful Build runs on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      FULL_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute tag (sha-<short>, matching repo convention)
        run: echo "SHA=sha-${FULL_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install Podman and Buildah
        run: sudo apt update && sudo apt install -y buildah podman skopeo

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build qcow2 with image-builder
        # No host storage mount: the builder pulls the (public) base image
        # itself. Mounting /var/lib/containers/storage made osbuild fail with
        # "mount /run/osbuild/containers/storage: permission denied".
        # seccomp/apparmor unconfined: the builder's bwrap/user-namespace
        # setup is blocked by Ubuntu's default AppArmor userns restriction.
        run: |
          set -euxo pipefail
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$PWD/output:/output" \
            ghcr.io/osbuild/image-builder-cli:latest \
            build --output-dir /output \
              --bootc-ref ghcr.io/kevindurb/ci-runner:latest \
              --bootc-default-fs xfs \
              --bootc-pull-container \
              qcow2
          sudo find output -type f -name '*.qcow2'

      - name: Wrap qcow2 as a containerDisk image
        run: |
          set -euxo pipefail
          qcow2=$(sudo find output -type f -name '*.qcow2' | head -n1)
          mkdir -p disk-image
          sudo cp "$qcow2" disk-image/disk.img
          sudo chmod 0644 disk-image/disk.img
          printf 'FROM scratch\nCOPY disk.img /disk/disk.img\n' > disk-image/Containerfile

      - name: Push containerDisk image
        run: |
          set -euxo pipefail
          sudo podman build \
            -t ghcr.io/kevindurb/ci-runner-disk:${SHA} \
            -t ghcr.io/kevindurb/ci-runner-disk:latest \
            disk-image/
          sudo podman push ghcr.io/kevindurb/ci-runner-disk:${SHA}
          sudo podman push ghcr.io/kevindurb/ci-runner-disk:latest

      - uses: sigstore/cosign-installer@v3.10.1

      - name: Sign both images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euxo pipefail
          RUNNER_DIGEST=$(sudo skopeo inspect --format '{{.Digest}}' docker://ghcr.io/kevindurb/ci-runner:latest)
          DISK_DIGEST=$(sudo skopeo inspect --format '{{.Digest}}' docker://ghcr.io/kevindurb/ci-runner-disk:${SHA})
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/kevindurb/ci-runner@"${RUNNER_DIGEST}" \
            ghcr.io/kevindurb/ci-runner-disk@"${DISK_DIGEST}"
