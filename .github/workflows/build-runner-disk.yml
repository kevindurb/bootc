---
# Publish the ci-runner qcow2 as a KubeVirt containerDisk.
#
# GH-hosted runners cannot build the disk: osbuild needs nested user
# namespaces, which Ubuntu's kernel blocks (AppArmor restrict_unprivileged_userns).
# So the qcow2 is built locally from ghcr.io/kevindurb/ci-runner (see the
# "Rebuilding" note in docs/forgejo.md / the release notes), and published as
# a GitHub release asset under the ci-runner-disk/<date> tag. This workflow
# unwraps that asset, wraps it in a scratch image at /disk/disk.img, pushes
# ghcr.io/kevindurb/ci-runner-disk:<date> (+ :latest) and cosign-signs both
# ci-runner images.
#
# Triggers: publishing a release tagged ci-runner-disk/*, or manual dispatch
# with an explicit release_tag. (Building the qcow2 itself cannot happen on
# GH-hosted runners: nested user namespaces are blocked.)
name: Build runner disk
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'ci-runner-disk release tag to repack'
        required: true
        default: ci-runner-disk/2026.11.27

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  repack:
    name: Repack ci-runner qcow2 as a containerDisk
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'ci-runner-disk/')
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Install Podman, Skopeo and xz
        run: sudo apt update && sudo apt install -y podman skopeo xz-utils

      - name: Download and verify the qcow2
        run: |
          set -euxo pipefail
          base="https://github.com/kevindurb/bootc/releases/download/${RELEASE_TAG}"
          curl -fSL --retry 3 -o ci-runner-disk.qcow2.xz "$base/ci-runner-disk.qcow2.xz"
          curl -fSL --retry 3 -o checksums.txt "$base/ci-runner-disk.qcow2.xz.sha256"
          sha256sum -c checksums.txt

      - name: Decompress
        run: |
          set -euxo pipefail
          mkdir -p disk-image
          unxz -c ci-runner-disk.qcow2.xz > disk-image/disk.img
          chmod 0644 disk-image/disk.img

      - name: Wrap as a containerDisk image
        run: |
          set -euxo pipefail
          printf 'FROM scratch\nCOPY disk.img /disk/disk.img\n' > disk-image/Containerfile
          DISK_TAG="${RELEASE_TAG#ci-runner-disk/}"
          echo "DISK_TAG=${DISK_TAG}" >> "$GITHUB_ENV"
          sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          sudo podman build \
            -t "ghcr.io/kevindurb/ci-runner-disk:${DISK_TAG}" \
            -t ghcr.io/kevindurb/ci-runner-disk:latest \
            disk-image/

      - name: Push containerDisk image
        run: |
          set -euxo pipefail
          sudo podman push "ghcr.io/kevindurb/ci-runner-disk:${DISK_TAG}"
          sudo podman push ghcr.io/kevindurb/ci-runner-disk:latest

      - uses: sigstore/cosign-installer@v3.10.1

      - name: Sign both images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euxo pipefail
          auth=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          AUTHFILE="$HOME/.docker/config.json"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$AUTHFILE"
          export DOCKER_CONFIG="$HOME/.docker" REGISTRY_AUTH_FILE="$AUTHFILE"
          RUNNER_DIGEST=$(skopeo inspect --authfile "$AUTHFILE" --format '{{.Digest}}' docker://ghcr.io/kevindurb/ci-runner:latest)
          DISK_DIGEST=$(skopeo inspect --authfile "$AUTHFILE" --format '{{.Digest}}' "docker://ghcr.io/kevindurb/ci-runner-disk:${DISK_TAG}")
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "ghcr.io/kevindurb/ci-runner@${RUNNER_DIGEST}" \
            "ghcr.io/kevindurb/ci-runner-disk@${DISK_DIGEST}"
