name: probe-kvm
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ls -l /dev/kvm || echo "NO KVM"
          grep -m1 -c vmx /proc/cpuinfo || true
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          id
